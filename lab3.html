<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3. 연주시차와 거리 - 우주 탐구 실험실</title>
    <!-- Tailwind CSS CDN 및 FontAwesome 아이콘 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- 상단 헤더 & 돌아가기 버튼 -->
        <header class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div>
                <a href="index.html" class="inline-flex items-center text-sm text-cyan-400 hover:text-cyan-300 font-semibold mb-2 transition">
                    <i class="fas fa-arrow-left mr-2"></i> 가상 실험실 목록으로
                </a>
                <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">Lab 3. 연주시차와 별의 거리</h1>
            </div>
            <span class="px-3 py-1 bg-cyan-950/60 border border-cyan-800/60 text-cyan-400 text-xs font-bold rounded-full">중3 과학 천체</span>
        </header>

        <!-- 메인 인터랙티브 실험 영역 (2열 그리드) -->
        <main class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- 왼쪽 패널: 컨트롤러 및 계산 결과 -->
            <div class="glass-panel p-6 md:p-8 rounded-3xl space-y-6 flex flex-col justify-between">
                <div class="space-y-2">
                    <h2 class="text-xl font-bold text-emerald-400 flex items-center">
                        <i class="fas fa-compass mr-2"></i> 연주시차와 거리 관계
                    </h2>
                    <p class="text-sm text-slate-400">지구가 공전함에 따라 관측선이 연장되어, 아주 먼 배경에 별 S의 <strong>'겉보기 위치'</strong>가 주기적으로 흔들리는 것을 관찰해 보세요.</p>
                </div>

                <!-- 거리 조절 슬라이더 -->
                <div class="space-y-4 bg-slate-900/60 p-5 rounded-2xl border border-slate-800">
                    <div class="flex justify-between items-center font-mono">
                        <span class="text-slate-400 text-xs tracking-wider uppercase font-bold">DISTANCE (D)</span>
                        <span id="dist-display" class="text-emerald-400 text-3xl font-black italic">1.30 pc</span>
                    </div>
                    <input type="range" id="dist-slider" min="0.5" max="10.0" step="0.1" value="1.3" 
                           class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">
                    <div class="flex justify-between text-[11px] text-slate-500 font-mono">
                        <span>0.5 pc (가까울수록 겉보기 흔들림 큼)</span>
                        <span>10.0 pc (멀수록 미세함)</span>
                    </div>
                </div>

                <!-- 연주시차 계산 디스플레이 -->
                <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center relative overflow-hidden shadow-inner">
                    <p class="text-xs text-emerald-400 font-bold tracking-wider mb-2 font-mono">연주시차 (p") = 1 / 거리 (D)</p>
                    <div id="parallax-display" class="text-5xl font-black italic tracking-wide text-white drop-shadow-[0_0_20px_rgba(52,211,153,0.3)]">0.77"</div>
                </div>

                <!-- 빠른 별 선택 버튼 모음 & 공전 제어 -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-400 font-bold">실제 별 선택 (프리셋)</span>
                        <button id="toggle-orbit" onclick="toggleOrbit()" class="text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center gap-1 transition">
                            <i id="orbit-icon" class="fas fa-pause text-[10px]"></i> <span id="orbit-text">공전 일시정지</span>
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="applyStarPreset(1.3, this)" class="preset-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition border border-cyan-500 text-cyan-300">프록시마 (1.3pc)</button>
                        <button onclick="applyStarPreset(2.6, this)" class="preset-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition border border-transparent text-slate-400">시리우스 (2.6pc)</button>
                        <button onclick="applyStarPreset(7.7, this)" class="preset-btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition border border-transparent text-slate-400">베가 (7.7pc)</button>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 패널: 우주 다이어그램 (시선 연장 및 겉보기 위치 구현) -->
            <div class="glass-panel rounded-3xl min-h-[460px] relative flex flex-col items-center justify-center p-6 overflow-hidden">
                <svg id="diagram" class="w-full h-[400px]" viewBox="0 0 600 400">
                    <defs>
                        <!-- 배경 그리드 -->
                        <pattern id="grid-pattern" width="25" height="25" patternUnits="userSpaceOnUse">
                            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(51, 65, 85, 0.18)" stroke-width="1"/>
                        </pattern>
                        <!-- 광원 효과 -->
                        <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fb923c" />
                            <stop offset="100%" stop-color="transparent" />
                        </radialGradient>
                        <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fde047" />
                            <stop offset="100%" stop-color="transparent" />
                        </radialGradient>
                    </defs>

                    <rect width="100%" height="100%" fill="url(#grid-pattern)" />

                    <!-- 천구 배경 스크린 기준선 (X = 540) -->
                    <line x1="540" y1="20" x2="540" y2="380" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" stroke-dasharray="4 4" />
                    <text x="540" y="392" font-size="10" fill="#64748b" text-anchor="middle">천구 (배경 별자리 기준선)</text>

                    <!-- 지구 공전 궤도 (타원) -->
                    <ellipse cx="120" cy="200" rx="35" ry="110" fill="none" stroke="rgba(148, 163, 184, 0.25)" stroke-dasharray="4 4" stroke-width="1.5" />

                    <!-- 태양 (중심) -->
                    <circle cx="120" cy="200" r="24" fill="url(#sun-glow)" />
                    <circle cx="120" cy="200" r="14" fill="#f97316" />
                    <text x="120" y="204" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">태양</text>

                    <!-- 6개월 간격 최대 위치 안내 점 -->
                    <circle cx="120" cy="90" r="3.5" fill="none" stroke="#64748b" stroke-width="1.5" />
                    <text x="96" y="94" font-size="11" fill="#64748b" font-weight="bold">A (최대)</text>
                    <circle cx="120" cy="310" r="3.5" fill="none" stroke="#64748b" stroke-width="1.5" />
                    <text x="96" y="314" font-size="11" fill="#64748b" font-weight="bold">B (최대)</text>

                    <!-- 중심 기준선 (태양 -> 배경 기준 별) -->
                    <line x1="120" y1="200" x2="540" y2="200" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="2 2" />

                    <!-- 1. 지구 -> 별 S 시선 점선 -->
                    <line id="line-to-star" x1="120" y1="90" x2="260" y2="200" stroke="#00f2ff" stroke-width="2" stroke-dasharray="4 4" />
                    
                    <!-- 2. 별 S -> 배경 천구로 쭉 뻗어나가는 연장선 (그림판에서 그리신 하늘색 굵은 점선) -->
                    <line id="line-extended" x1="260" y1="200" x2="540" y2="310" stroke="#00f2ff" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.9" />

                    <!-- 실시간 공전 지구 -->
                    <g id="orbiting-earth" transform="translate(120, 90)">
                        <circle cx="0" cy="0" r="9" fill="#2563eb" stroke="#38bdf8" stroke-width="2" />
                        <text x="-16" y="4" font-size="10" fill="#38bdf8" font-weight="bold">지구</text>
                    </g>

                    <!-- 가까운 별 '별 S' -->
                    <g id="star-target" transform="translate(260, 200)">
                        <circle cx="0" cy="0" r="20" fill="url(#star-glow)" />
                        <circle cx="0" cy="0" r="8" fill="#eab308" />
                        <text x="0" y="24" font-size="12" fill="#fef08a" font-weight="bold" text-anchor="middle">별 S</text>
                    </g>

                    <!-- 고정된 먼 배경 별 (기준점) -->
                    <g transform="translate(540, 200)">
                        <circle cx="0" cy="0" r="10" fill="rgba(255, 255, 255, 0.25)" />
                        <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
                        <text x="0" y="-12" font-size="10" fill="#94a3b8" text-anchor="middle">먼 별(기준)</text>
                    </g>

                    <!-- 천구에 맺히는 별 S의 '겉보기 위치' (동적으로 위아래 이동) -->
                    <g id="apparent-star" transform="translate(540, 310)">
                        <circle cx="0" cy="0" r="14" fill="rgba(0, 242, 255, 0.25)" class="animate-ping" />
                        <circle cx="0" cy="0" r="8" fill="#00f2ff" stroke="#ffffff" stroke-width="1.5" />
                        <text x="14" y="4" font-size="11" fill="#00f2ff" font-weight="extrabold">별 S의 겉보기 위치</text>
                    </g>
                </svg>
            </div>
        </main>

        <!-- 하단: 학생들이 헷갈리기 쉬운 오개념 (랜덤 2개 표시) -->
        <section class="space-y-4 pt-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xl">💡</span>
                    <h3 class="text-lg font-bold text-white">잠깐! 헷갈리기 쉬운 별의 비밀 (랜덤 오개념 클리닉)</h3>
                </div>
                <button onclick="renderRandomMisconceptions()" class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-xl border border-slate-700 flex items-center gap-1.5 transition">
                    <i class="fas fa-sync-alt text-[10px]"></i> 다른 질문 보기
                </button>
            </div>
            
            <!-- 랜덤 2개 카드가 삽입될 컨테이너 -->
            <div id="misconception-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- JS가 2개를 무작위로 채워 넣습니다 -->
            </div>
        </section>

    </div>

    <!-- 인터랙션 & 지구 공전 / 시선 연장선 계산 스크립트 -->
    <script>
        const slider = document.getElementById('dist-slider');
        const distDisplay = document.getElementById('dist-display');
        const parallaxDisplay = document.getElementById('parallax-display');
        const starTarget = document.getElementById('star-target');
        const lineToStar = document.getElementById('line-to-star');
        const lineExtended = document.getElementById('line-extended');
        const apparentStar = document.getElementById('apparent-star');
        const orbitingEarth = document.getElementById('orbiting-earth');

        const MIN_DIST = 0.5;
        const MAX_DIST = 10.0;
        const MIN_X = 180;
        const MAX_X = 460;
        const SCREEN_X = 540; // 천구 배경 스크린 위치

        let currentStarX = 260;
        const starY = 200;
        let isOrbiting = true;
        let angle = 0; // 공전 각도(라디안)

        // 궤도 타원 기준점
        const centerX = 120;
        const centerY = 200;
        const radiusX = 35;
        const radiusY = 110;

        function updateSimulation(d) {
            const distance = parseFloat(d);
            distDisplay.textContent = distance.toFixed(2) + ' pc';
            
            const p = 1 / distance;
            parallaxDisplay.textContent = p.toFixed(2) + '"';

            const ratio = (distance - MIN_DIST) / (MAX_DIST - MIN_DIST);
            currentStarX = MIN_X + ratio * (MAX_X - MIN_X);
            
            starTarget.setAttribute('transform', `translate(${currentStarX}, ${starY})`);
        }

        // 공전 및 시선 연장선 기하학적 계산 애니메이션 루프
        function animateOrbit() {
            if (isOrbiting) {
                angle += 0.015;
                if (angle > Math.PI * 2) angle = 0;

                const earthX = centerX + radiusX * Math.sin(angle);
                const earthY = centerY - radiusY * Math.cos(angle);

                // 1. 지구 위치
                orbitingEarth.setAttribute('transform', `translate(${earthX}, ${earthY})`);
                
                // 2. 지구 -> 별 S 선분
                lineToStar.setAttribute('x1', earthX);
                lineToStar.setAttribute('y1', earthY);
                lineToStar.setAttribute('x2', currentStarX);
                lineToStar.setAttribute('y2', starY);

                // 3. 별 S를 통과해 배경 스크린(천구)까지 연장되는 직선 계산
                // 기울기 m = (starY - earthY) / (currentStarX - earthX)
                // x = SCREEN_X (540) 일 때 y 좌표 계산: y = starY + m * (SCREEN_X - currentStarX)
                const slope = (starY - earthY) / (currentStarX - earthX);
                const apparentY = starY + slope * (SCREEN_X - currentStarX);

                lineExtended.setAttribute('x1', currentStarX);
                lineExtended.setAttribute('y1', starY);
                lineExtended.setAttribute('x2', SCREEN_X);
                lineExtended.setAttribute('y2', apparentY);

                // 4. 천구 상의 별 S 겉보기 위치 이동
                apparentStar.setAttribute('transform', `translate(${SCREEN_X}, ${apparentY})`);
            }
            requestAnimationFrame(animateOrbit);
        }

        function toggleOrbit() {
            isOrbiting = !isOrbiting;
            const icon = document.getElementById('orbit-icon');
            const text = document.getElementById('orbit-text');
            if (isOrbiting) {
                icon.className = 'fas fa-pause text-[10px]';
                text.textContent = '공전 일시정지';
            } else {
                icon.className = 'fas fa-play text-[10px]';
                text.textContent = '공전 재개';
            }
        }

        slider.addEventListener('input', (e) => {
            updateSimulation(e.target.value);
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('border-cyan-500', 'text-cyan-300');
                btn.classList.add('border-transparent', 'text-slate-400');
            });
        });

        function applyStarPreset(dist, element) {
            slider.value = dist;
            updateSimulation(dist);

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('border-cyan-500', 'text-cyan-300');
                btn.classList.add('border-transparent', 'text-slate-400');
            });
            element.classList.add('border-cyan-500', 'text-cyan-300');
            element.classList.remove('border-transparent', 'text-slate-400');
        }

        // ==========================================
        // 오개념 6가지 데이터 및 랜덤 2개 렌더링 시스템
        // ==========================================
        const misconceptions = [
            {
                qNum: "Q1",
                badgeColor: "bg-red-500/10 text-red-400",
                titleColor: "text-red-300",
                question: "연주시차는 6개월 간격 관측 각도의 전체 크기인가요?",
                answer: "<strong class='text-emerald-400'>오답!</strong> 6개월 간격으로 관측한 두 시선 사이 각도(시차)의 <strong>절반(1/2)</strong>이 바로 연주시차입니다. 지구-태양 간 거리(1 AU)를 밑변으로 하는 직각삼각형 기준입니다."
            },
            {
                qNum: "Q2",
                badgeColor: "bg-amber-500/10 text-amber-400",
                titleColor: "text-amber-300",
                question: "연주시차가 클수록 지구에서 더 멀리 있는 별인가요?",
                answer: "<strong class='text-emerald-400'>정반대!</strong> 거리와 연주시차는 <strong>반비례 관계(d = 1/p)</strong>입니다. 별이 가까울수록 시각적인 흔들림(연주시차)이 크게 벌어지고, 멀수록 0에 가깝게 작아집니다."
            },
            {
                qNum: "Q3",
                badgeColor: "bg-blue-500/10 text-blue-400",
                titleColor: "text-blue-300",
                question: "별이 우주 공간에서 실제로 움직여서 생기는 각도인가요?",
                answer: "<strong class='text-emerald-400'>아닙니다!</strong> 별은 가만히 있는데, <strong>지구가 태양 주위를 공전</strong>하기 때문에 관측자의 위치가 바뀌어서 생기는 '겉보기 상대 운동'일 뿐입니다."
            },
            {
                qNum: "Q4",
                badgeColor: "bg-purple-500/10 text-purple-400",
                titleColor: "text-purple-300",
                question: "우주의 모든 별과 은하의 거리를 연주시차로 잴 수 있나요?",
                answer: "<strong class='text-emerald-400'>불가능합니다!</strong> 약 100 pc보다 멀리 있는 별은 연주시차가 너무 미세해서 지구상에서 측정이 불가능합니다. 먼 천체는 변광성이나 적색편이 방법을 사용합니다."
            },
            {
                qNum: "Q5",
                badgeColor: "bg-cyan-500/10 text-cyan-400",
                titleColor: "text-cyan-300",
                question: "연주시차의 단위 초(\")는 '시간(초)'을 뜻하나요?",
                answer: "<strong class='text-emerald-400'>시간이 아닌 각도!</strong> 1°(도)를 60등분한 것이 1'(분), 그 1분을 다시 60등분한 극도로 미세한 각도가 바로 <strong>1\"(초)</strong>입니다. 즉, 1\" = 1/3600도입니다."
            },
            {
                qNum: "Q6",
                badgeColor: "bg-emerald-500/10 text-emerald-400",
                titleColor: "text-emerald-300",
                question: "지구 자전 때문에 하루 동안에도 연주시차가 생기나요?",
                answer: "<strong class='text-emerald-400'>공전의 증거!</strong> 하루 주기의 자전은 '일주시차'라 부르며 별까지의 거리를 재기엔 턱없이 작습니다. 연주시차는 <strong>지구 공전의 결정적인 증거</strong>입니다."
            }
        ];

        function renderRandomMisconceptions() {
            const container = document.getElementById('misconception-container');
            // 배열 무작위 셔플 후 2개 추출
            const shuffled = [...misconceptions].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 2);

            container.innerHTML = selected.map(item => `
                <div class="glass-panel p-6 rounded-2xl flex flex-col justify-between border border-slate-800 space-y-3 transition duration-300 hover:border-slate-700">
                    <div class="flex items-start gap-3">
                        <span class="${item.badgeColor} p-2 rounded-lg text-sm font-bold shrink-0">${item.qNum}</span>
                        <h4 class="font-bold ${item.titleColor} text-sm md:text-base leading-snug">${item.question}</h4>
                    </div>
                    <p class="text-xs md:text-sm text-slate-300 leading-relaxed bg-slate-900/60 p-4 rounded-xl border border-slate-800/50">
                        ${item.answer}
                    </p>
                </div>
            `).join('');
        }

        // 초기화 실행
        updateSimulation(slider.value);
        animateOrbit();
        renderRandomMisconceptions();
    </script>
</body>
</html>
