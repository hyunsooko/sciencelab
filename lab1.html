<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1. 별의 온도와 색깔 - 우주 탐구 실험실</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px 0;
            font-family: system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }

        /* 카드 공통 스타일 */
        .control-card, .viewer-card, .discovery-card, .faq-item-card {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid #334155 !important;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* 컨트롤러 스타일 */
        .temperature-value {
            color: #60a5fa !important;
            font-size: 1.8rem !important;
            font-weight: 800 !important;
        }

        .star-info .info-item {
            background-color: #0f172a !important;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .star-info .info-item span { color: #94a3b8 !important; font-size: 0.9rem; }
        .star-info .info-item strong { color: #ffffff !important; font-size: 1rem; }

        /* 뷰어 스타일 */
        .spectral-text { color: #94a3b8 !important; font-weight: 600; letter-spacing: 1px; font-size: 0.85rem; }
        .spectral-type { color: #818cf8 !important; font-size: 2.8rem !important; font-weight: bold !important; margin: 4px 0; }
        #starDisplayName { color: #ffffff !important; font-size: 1.4rem; margin: 4px 0 2px 0; }
        #starDescription { color: #cbd5e1 !important; font-size: 0.9rem; margin: 0; }

        #temperatureSlider {
            width: 100%;
            height: 8px;
            accent-color: #3b82f6;
            cursor: pointer;
            margin: 10px 0;
        }

        /* 💡 오늘의 발견 카드 (파란색 포인트 카드로 강조) */
        .discovery-card {
            background-color: #3b82f6 !important; /* 파란색 배경으로 시선 집중 */
            border: none !important;
            margin-top: 12px;
            padding: 16px 20px;
        }
        .discovery-card h3 {
            color: #fef08a !important; /* 밝은 노란색 */
            font-size: 1rem !important;
            margin-top: 0;
            margin-bottom: 4px;
        }
        #discoveryText {
            color: #ffffff !important;
            font-size: 0.95rem !important;
            line-height: 1.4;
            margin: 0;
            font-weight: 500;
        }

        /* ⚠️ 오개념 FAQ 영역 스타일 (하단 전체 통으로 길게 배치) */
        .faq-section {
            margin-top: 16px;
            width: 100%;
        }
        .faq-title {
            color: #facc15 !important;
            font-size: 1.1rem !important;
            font-weight: bold;
            margin-bottom: 10px;
        }
        /* 오개념 카드가 들어갈 가로 2열 그리드 */
        .faq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 하단 전체를 가로 2칸으로 길게 분할 */
            gap: 16px;
        }
        .faq-item-card h4 {
            color: #60a5fa !important;
            font-size: 0.95rem !important;
            margin-top: 0;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .faq-item-card p {
            color: #cbd5e1 !important;
            font-size: 0.88rem !important;
            line-height: 1.5;
            margin: 0;
        }

        /* 대시보드 2열 그리드 (좌측 컨트롤러+오늘의발견 / 우측 별 뷰어) */
        .top-dashboard {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr; /* 좌측 창 폭을 좁히고 우측을 넓힘 */
            gap: 16px;
            align-items: start;
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 1100px; margin: 0 auto; padding: 0 16px;">
        <!-- 상단 헤더 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div>
                <h2 class="lab-title" style="color: white; font-size: 1.5rem; margin: 0;">🌡️ Lab 1. 별의 온도와 색깔</h2>
                <p class="lab-subtitle" style="color: #94a3b8; margin: 2px 0 0 0; font-size: 0.9rem;">
                    슬라이더를 움직여 별의 표면 온도를 바꾸고, 별의 색과 종류가 어떻게 달라지는지 관찰해 보세요.
                </p>
            </div>
            <a href="index.html" class="btn" style="background-color: #3b82f6; color: white; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.85rem;">← 메인 목록으로 돌아가기</a>
        </div>

        <!-- 1. 상단 대시보드 (좌: 컨트롤러+오늘의발견 / 우: 별 뷰어) -->
        <div class="top-dashboard">
            
            <!-- ⬅️ 좌측 (좁아진 폭) -->
            <div class="left-column">
                <!-- 컨트롤러 카드 -->
                <div class="control-card">
                    <h3 style="color: white; margin-top: 0; margin-bottom: 4px; font-size: 1rem;">현재 온도</h3>
                    <div id="temperatureValue" class="temperature-value">5,800 K</div>
                    <input id="temperatureSlider" type="range" min="3000" max="50000" step="100" value="5800">

                    <div class="star-info">
                        <div class="info-item"><span>대표 별</span><strong id="starName">태양</strong></div>
                        <div class="info-item"><span>스펙트럼</span><strong id="starType">G형</strong></div>
                        <div class="info-item"><span>별의 색</span><strong id="starLabel">황색</strong></div>
                    </div>
                </div>

                <!-- 오늘의 발견 카드 (컨트롤러 바로 밑으로 올려 붙임) -->
                <div class="discovery-card">
                    <h3>💡 오늘의 발견</h3>
                    <p id="discoveryText">
                        태양은 노란색이지만 가장 뜨거운 별은 아닙니다.
                    </p>
                </div>
            </div>

            <!-- ➡️ 우측 (넓은 별 뷰어) -->
            <div class="right-column">
                <div class="viewer-card" style="text-align: center; padding: 24px;">
                    <div class="star-wrapper" style="position: relative; height: 130px; display: flex; align-items: center; justify-content: center;">
                        <div id="starGlow" style="position: absolute; width: 100px; height: 100px; border-radius: 50%; background: #ffd54f; filter: blur(20px); opacity: 0.6;"></div>
                        <div id="star" style="position: relative; width: 80px; height: 80px; border-radius: 50%; background: #ffd54f; transition: background 0.2s;"></div>
                    </div>
                    <div class="spectral-text">SPECTRAL TYPE</div>
                    <div id="spectralType" class="spectral-type">G</div>
                    <h2 id="starDisplayName">태양</h2>
                    <p id="starDescription">우리 태양과 비슷한 표면 온도를 가진 황색 별입니다.</p>
                </div>
            </div>

        </div>

        <!-- 2. 하단 대형 오개념 FAQ 영역 (가로로 길게 통으로 배치) -->
        <div class="faq-section">
            <div class="faq-title">
                ⚠️ 잠깐! 헷갈리기 쉬운 별의 비밀 (오개념 FAQ)
            </div>
            <div id="faqContainer" class="faq-grid">
                <!-- 자바스크립트로 생성된 2개의 오개념 카드가 여기에 들어옵니다 -->
            </div>
        </div>

    </div>

    <!-- 스크립트 연결 -->
    <script src="js/lab1.js"></script>
</body>
</html>
