<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1. 별의 온도와 색깔 - 우주 탐구 실험실</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px 0;
            font-family: system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }

        /* 헤더 영역 */
        .lab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }

        .lab-title {
            color: #ffffff !important;
            font-size: 2rem !important;
            font-weight: 800 !important;
            margin: 0;
        }

        .lab-subtitle {
            color: #94a3b8 !important;
            font-size: 0.95rem !important;
            margin: 4px 0 0 0;
        }

        .back-btn {
            background-color: #334155;
            color: #f8fafc;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .back-btn:hover {
            background-color: #475569;
        }

        /* 카드 공통 스타일 */
        .control-card, .viewer-card, .discovery-card {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid #334155 !important;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* 컨트롤러 스타일 */
        .temperature-value {
            color: #60a5fa !important;
            font-size: 2rem !important;
            font-weight: 800 !important;
        }

        .star-info .info-item {
            background-color: #0f172a !important;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .star-info .info-item span { color: #94a3b8 !important; font-size: 0.95rem; }
        .star-info .info-item strong { color: #ffffff !important; font-size: 1.05rem; }

        /* 뷰어 스타일 */
        .spectral-text { color: #94a3b8 !important; font-weight: 600; letter-spacing: 1px; font-size: 0.9rem; }
        .spectral-type { color: #818cf8 !important; font-size: 3.5rem !important; font-weight: bold !important; margin: 6px 0; }
        #starDisplayName { color: #ffffff !important; font-size: 1.6rem; margin: 6px 0 2px 0; }
        #starDescription { color: #cbd5e1 !important; font-size: 0.95rem; margin: 0; }

        #temperatureSlider {
            width: 100%;
            height: 8px;
            accent-color: #3b82f6;
            cursor: pointer;
            margin: 12px 0;
        }

        /* 💡 오늘의 발견 카드 */
        .discovery-card {
            background-color: #3b82f6 !important;
            border: none !important;
            margin-top: 14px;
            padding: 16px;
        }
        .discovery-card h3 {
            color: #fef08a !important;
            font-size: 1.05rem !important;
            margin-top: 0;
            margin-bottom: 6px;
        }
        #discoveryText {
            color: #ffffff !important;
            font-size: 0.95rem !important;
            line-height: 1.4;
            margin: 0;
            font-weight: 500;
        }

        /* ⚠️ 질문/답변 명확한 구별을 위한 FAQ 스타일 */
        .faq-section {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px 20px;
        }

        .faq-title {
            color: #facc15 !important;
            font-size: 1.1rem !important;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 각 질문-답변 세트 항목 */
        .faq-item {
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }

        .faq-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        /* 질문(Q) 스타일: 밝은 파란색 및 두꺼운 글씨 */
        .faq-question {
            color: #60a5fa !important;
            font-size: 0.98rem !important;
            font-weight: 700 !important;
            margin: 0 0 6px 0;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .faq-question .q-badge {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 0.8rem;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 800;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* 답변(A) 스타일: 여백 구분 및 연한 글씨 */
        .faq-answer {
            color: #cbd5e1 !important;
            font-size: 0.88rem !important;
            line-height: 1.55;
            margin: 0;
            padding-left: 28px; /* 질문 태그 뒤로 깔끔하게 들여쓰기 */
            position: relative;
        }

        .faq-answer::before {
            content: "A.";
            position: absolute;
            left: 8px;
            color: #94a3b8;
            font-weight: 700;
        }

        /* 3열 대시보드 레이아웃 */
        .main-dashboard {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr 1.15fr;
            gap: 20px;
            align-items: start;
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 1400px; margin: 0 auto; padding: 0 24px;">
        
        <!-- 헤더 영역 -->
        <header class="lab-header">
            <div>
                <h2 class="lab-title">🌡️ Lab 1. 별의 온도와 색깔</h2>
                <p class="lab-subtitle">
                    슬라이더를 움직여 별의 표면 온도를 바꾸고, 별의 색과 종류가 어떻게 달라지는지 관찰해 보세요.
                </p>
            </div>
            <a href="index.html" class="back-btn">← 메인으로</a>
        </header>

        <!-- 대시보드 메인 영역 -->
        <div class="main-dashboard">
            
            <!-- 1열 (왼쪽) -->
            <div class="column-1">
                <div class="control-card">
                    <h3 style="color: white; margin-top: 0; margin-bottom: 6px; font-size: 1.1rem;">현재 온도</h3>
                    <div id="temperatureValue" class="temperature-value">5,800 K</div>
                    <input id="temperatureSlider" type="range" min="3000" max="50000" step="100" value="5800">

                    <div class="star-info">
                        <div class="info-item"><span>대표 별</span><strong id="starName">태양</strong></div>
                        <div class="info-item"><span>스펙트럼</span><strong id="starType">G형</strong></div>
                        <div class="info-item"><span>별의 색</span><strong id="starLabel">황색</strong></div>
                    </div>
                </div>

                <div class="discovery-card">
                    <h3>💡 오늘의 발견</h3>
                    <p id="discoveryText">
                        태양은 노란색이지만 가장 뜨거운 별은 아닙니다.
                    </p>
                </div>
            </div>

            <!-- 2열 (중앙) -->
            <div class="column-2">
                <div class="viewer-card" style="text-align: center; padding: 28px 20px;">
                    <div class="star-wrapper" style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center;">
                        <div id="starGlow" style="position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ffd54f; filter: blur(22px); opacity: 0.6;"></div>
                        <div id="star" style="position: relative; width: 95px; height: 95px; border-radius: 50%; background: #ffd54f; transition: background 0.2s;"></div>
                    </div>
                    <div class="spectral-text">SPECTRAL TYPE</div>
                    <div id="spectralType" class="spectral-type">G</div>
                    <h2 id="starDisplayName">태양</h2>
                    <p id="starDescription">우리 태양과 비슷한 표면 온도를 가진 황색 별입니다.</p>
                </div>
            </div>

            <!-- 3열 (오른쪽): Q & A 구분된 오개념 영역 -->
            <div class="column-3">
                <div class="faq-section">
                    <div class="faq-title">
                        ⚠️ 잠깐! 헷갈리기 쉬운 별의 비밀
                    </div>
                    <div id="faqContainer" class="faq-list">
                        <!-- 자바스크립트로 Q와 A가 구분된 목록이 들어옵니다 -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 스크립트 연결 -->
    <script src="js/lab1.js"></script>
</body>
</html>
