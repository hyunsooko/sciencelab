<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1. 별의 온도와 색깔 - 우주 탐구 실험실</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px 0;
            font-family: system-ui, -apple-system, sans-serif;
            box-sizing: border-box;
        }

        /* 카드 공통 기본 스타일 */
        .control-card, .viewer-card, .discovery-card, .faq-card {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid #334155 !important;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* 1) 상단 제목 크기 확대 및 스타일 */
        .lab-title {
            color: #ffffff !important;
            font-size: 2.2rem !important; /* 시원하게 확 키운 제목 크기 */
            font-weight: 800 !important;
            margin: 0;
        }

        .lab-subtitle {
            color: #94a3b8 !important;
            font-size: 1.05rem !important;
            margin: 6px 0 0 0;
        }

        /* 컨트롤러 스타일 */
        .temperature-value {
            color: #60a5fa !important;
            font-size: 2rem !important;
            font-weight: 800 !important;
        }

        .star-info .info-item {
            background-color: #0f172a !important;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .star-info .info-item span { color: #94a3b8 !important; font-size: 0.95rem; }
        .star-info .info-item strong { color: #ffffff !important; font-size: 1.05rem; }

        /* 뷰어 스타일 */
        .spectral-text { color: #94a3b8 !important; font-weight: 600; letter-spacing: 1px; font-size: 0.9rem; }
        .spectral-type { color: #818cf8 !important; font-size: 3.5rem !important; font-weight: bold !important; margin: 6px 0; }
        #starDisplayName { color: #ffffff !important; font-size: 1.6rem; margin: 6px 0 2px 0; }
        #starDescription { color: #cbd5e1 !important; font-size: 0.95rem; margin: 0; }

        #temperatureSlider {
            width: 100%;
            height: 8px;
            accent-color: #3b82f6;
            cursor: pointer;
            margin: 12px 0;
        }

        /* 💡 오늘의 발견 카드 */
        .discovery-card {
            background-color: #3b82f6 !important;
            border: none !important;
            margin-top: 14px;
            padding: 16px;
        }
        .discovery-card h3 {
            color: #fef08a !important;
            font-size: 1.05rem !important;
            margin-top: 0;
            margin-bottom: 6px;
        }
        #discoveryText {
            color: #ffffff !important;
            font-size: 0.95rem !important;
            line-height: 1.4;
            margin: 0;
            font-weight: 500;
        }

        /* ⚠️ 2) 오개념 FAQ (우측 3열 배치 스타일) */
        .faq-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .faq-title {
            color: #facc15 !important;
            font-size: 1.15rem !important;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .faq-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .faq-card {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            border-radius: 14px;
            padding: 16px;
        }
        .faq-card h4 {
            color: #60a5fa !important;
            font-size: 0.98rem !important;
            margin-top: 0;
            margin-bottom: 6px;
            line-height: 1.35;
        }
        .faq-card p {
            color: #cbd5e1 !important;
            font-size: 0.9rem !important;
            line-height: 1.5;
            margin: 0;
        }

        /* 3열 대시보드 구조 (가로 여백을 가득 채우는 1:1.1:1.1 그리드) */
        .main-dashboard {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr 1.15fr; /* 3개 구역 가로 분할 */
            gap: 20px;
            align-items: start;
        }
    </style>
</head>
<body>

    <!-- 화면 전체 폭을 가득 활용하도록 max-width를 1400px로 확장 -->
    <div class="container" style="max-width: 1400px; margin: 0 auto; padding: 0 24px;">
        
        <!-- 상단 헤더 영역 -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
            <div>
                <h2 class="lab-title">🌡️ Lab 1. 별의 온도와 색깔</h2>
                <p class="lab-subtitle">
                    슬라이더를 움직여 별의 표면 온도를 바꾸고, 별의 색과 종류가 어떻게 달라지는지 관찰해 보세요.
                </p>
            </div>
            <a href="index.html" class="btn" style="background-color: #3b82f6; color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem;">← 메인 목록으로 돌아가기</a>
        </div>

        <!-- 🖥️ 3열 가로 풀화면 대시보드 -->
        <div class="main-dashboard">
            
            <!-- 1열 (왼쪽): 컨트롤러 + 오늘의 발견 -->
            <div class="column-1">
                <div class="control-card">
                    <h3 style="color: white; margin-top: 0; margin-bottom: 6px; font-size: 1.1rem;">현재 온도</h3>
                    <div id="temperatureValue" class="temperature-value">5,800 K</div>
                    <input id="temperatureSlider" type="range" min="3000" max="50000" step="100" value="5800">

                    <div class="star-info">
                        <div class="info-item"><span>대표 별</span><strong id="starName">태양</strong></div>
                        <div class="info-item"><span>스펙트럼</span><strong id="starType">G형</strong></div>
                        <div class="info-item"><span>별의 색</span><strong id="starLabel">황색</strong></div>
                    </div>
                </div>

                <div class="discovery-card">
                    <h3>💡 오늘의 발견</h3>
                    <p id="discoveryText">
                        태양은 노란색이지만 가장 뜨거운 별은 아닙니다.
                    </p>
                </div>
            </div>

            <!-- 2열 (중앙): 별 뷰어 카드 -->
            <div class="column-2">
                <div class="viewer-card" style="text-align: center; padding: 28px 20px;">
                    <div class="star-wrapper" style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center;">
                        <div id="starGlow" style="position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ffd54f; filter: blur(22px); opacity: 0.6;"></div>
                        <div id="star" style="position: relative; width: 95px; height: 95px; border-radius: 50%; background: #ffd54f; transition: background 0.2s;"></div>
                    </div>
                    <div class="spectral-text">SPECTRAL TYPE</div>
                    <div id="spectralType" class="spectral-type">G</div>
                    <h2 id="starDisplayName">태양</h2>
                    <p id="starDescription">우리 태양과 비슷한 표면 온도를 가진 황색 별입니다.</p>
                </div>
            </div>

            <!-- 3열 (오른쪽): 오개념 FAQ 카드 2개 -->
            <div class="column-3">
                <div class="faq-section">
                    <div class="faq-title">
                        ⚠️ 잠깐! 헷갈리기 쉬운 별의 비밀 (오개념 FAQ)
                    </div>
                    <div id="faqContainer" class="faq-grid">
                        <!-- 자바스크립트로 생성된 2개의 오개념 카드가 여기에 쏙 들어옵니다 -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 로직 자바스크립트 연결 -->
    <script src="js/lab1.js"></script>
</body>
</html>
