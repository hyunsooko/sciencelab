<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1. 별의 온도와 색깔 - 우주 탐구 실험실</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .control-card, .viewer-card, .discovery-card {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid #334155 !important;
            border-radius: 16px;
            padding: 24px;
        }

        .temperature-value {
            color: #60a5fa !important;
            font-size: 2.2rem !important;
            font-weight: 800 !important;
        }

        .star-info .info-item {
            background-color: #0f172a !important;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .star-info .info-item span { color: #94a3b8 !important; }
        .star-info .info-item strong { color: #ffffff !important; font-size: 1.1rem; }

        .spectral-text { color: #94a3b8 !important; font-weight: 600; letter-spacing: 1px; }
        .spectral-type { color: #818cf8 !important; font-size: 3.5rem !important; font-weight: bold !important; margin: 10px 0; }
        #starDisplayName { color: #ffffff !important; font-size: 1.8rem; margin: 10px 0 5px 0; }
        #starDescription { color: #cbd5e1 !important; font-size: 1.05rem; }

        #temperatureSlider {
            width: 100%;
            height: 10px;
            accent-color: #3b82f6;
            cursor: pointer;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container" style="padding-top: 30px; padding-bottom: 50px; max-width: 1000px; margin: 0 auto;">
        <a href="index.html" class="btn" style="background-color: #3b82f6; color: white; display: inline-block; padding: 10px 18px; border-radius: 8px; margin-bottom: 20px; text-decoration: none; font-weight: 600;">← 메인 목록으로 돌아가기</a>

        <h2 class="lab-title" style="color: white; font-size: 1.8rem;">🌡️ Lab 1. 별의 온도와 색깔</h2>
        <p class="lab-subtitle" style="color: #94a3b8; margin-bottom: 24px;">
            슬라이더를 움직여 별의 표면 온도를 바꾸고, 별의 색과 종류가 어떻게 달라지는지 관찰해 보세요.
        </p>

        <div class="lab-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <!-- 컨트롤러 카드 -->
            <div class="control-card">
                <h3 style="color: white; margin-top: 0; margin-bottom: 10px;">현재 온도</h3>
                <div id="temperatureValue" class="temperature-value">5,800 K</div>
                
                <!-- max 값을 50000으로 늘려 30,000K 이상까지 여유롭게 이동 가능하도록 수정 -->
                <input id="temperatureSlider" type="range" min="3000" max="50000" step="100" value="5800">

                <div class="star-info">
                    <div class="info-item"><span>대표 별</span><strong id="starName">태양</strong></div>
                    <div class="info-item"><span>스펙트럼</span><strong id="starType">G형</strong></div>
                    <div class="info-item"><span>별의 색</span><strong id="starLabel">황색</strong></div>
                </div>
            </div>

            <!-- 뷰어 카드 -->
            <div class="viewer-card" style="text-align: center;">
                <div class="star-wrapper" style="position: relative; height: 180px; display: flex; align-items: center; justify-content: center;">
                    <div id="starGlow" style="position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ffd54f; filter: blur(20px); opacity: 0.6;"></div>
                    <div id="star" style="position: relative; width: 100px; height: 100px; border-radius: 50%; background: #ffd54f; transition: background 0.2s;"></div>
                </div>
                <div class="spectral-text">SPECTRAL TYPE</div>
                <div id="spectralType" class="spectral-type">G</div>
                <h2 id="starDisplayName">태양</h2>
                <p id="starDescription">우리 태양과 비슷한 표면 온도를 가진 황색 별입니다.</p>
            </div>
        </div>

        <div class="discovery-card" style="margin-top: 24px;">
            <h3 style="color: white; margin-top: 0;">💡 오늘의 발견</h3>
            <p id="discoveryText" style="color: #60a5fa; font-size: 1.1rem; margin-top: 8px; margin-bottom: 0;">
                태양은 노란색이지만 가장 뜨거운 별은 아닙니다.
            </p>
        </div>
    </div>

    <script src="js/lab1.js"></script>
</body>
</html>
